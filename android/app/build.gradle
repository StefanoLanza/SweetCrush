plugins {
     id 'com.android.application'
}

def buildWithCMake = project.hasProperty('BUILD_WITH_CMAKE')

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"
    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            ndkBuild {
                // for SDL and game
                def modulePaths = [
                        "${rootProject.projectDir}/../external",
                        "${rootProject.projectDir}/.."
                ]
                // Join the list into a single string using the OS-specific path separator.
                def ndkModulePath = modulePaths.join(File.pathSeparator)

                arguments "APP_PLATFORM=android-29", "ANDROID_STL=c++_shared"
                arguments "NDK_MODULE_PATH=${ndkModulePath}"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'x86_64'
                cppFlags "-std=c++17"
                cppFlags "-fexceptions"
            }
            cmake {
                arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_shared"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties.storeFile)
                storePassword keystoreProperties.storePassword
                keyAlias keystoreProperties.keyAlias
                keyPassword keystoreProperties.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // debug builds will continue to use the auto-generated debug key
        }
    }
    applicationVariants.all { variant ->
        def mergeAssetsTask = tasks.findByName("merge${variant.name.capitalize()}Assets")
        def nativeBuildTask = tasks.findByName("externalNativeBuild${variant.name.capitalize()}")
        if (mergeAssetsTask != null && nativeBuildTask != null) {
            mergeAssetsTask.dependsOn(nativeBuildTask)
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
   //     sourceSets.main {
     //       jniLibs.srcDir 'libs'
      //  }
        externalNativeBuild {
            if (buildWithCMake) {
                cmake {
                    path 'jni/CMakeLists.txt'
                }
            } else {
                ndkBuild {
                    path 'jni/Android.mk'
                }
            }
        }

    }

    lint {
        abortOnError = false
    }
    sourceSets {
        main {
            // Get the root project's directory object.
            def gameRoot = rootProject.projectDir.parentFile
            // Construct the full path to the assets directory.
            def assetPath = new File(gameRoot, 'bin/assets')
            // This line tells Gradle to look for assets in the specified
            // external directory in addition to the default one.
            assets.srcDirs += [assetPath]
        }
    }
}

// Prebuilt dependencies
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}

tasks.register('checkAssetPaths') {
    doLast {
        println ">>> [DEBUG] Checking asset source directories..."
        android.sourceSets.main.assets.srcDirs.each { dir ->
            println ">>> Gradle sees asset path: ${dir.absolutePath}"
            if (dir.exists()) {
                println ">>> Path exists: YES"
            } else {
                println ">>> Path exists: NO - THIS IS THE PROBLEM"
            }
        }
    }
}